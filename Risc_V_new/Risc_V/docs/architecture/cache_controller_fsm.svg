    <text x="45" y="665" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#173F5F">Bất biến: một giao dịch coherence nguyên tử; dirty owner là nguồn dữ liệu mới nhất; lỗi memory không được cài line lỗi.</text></svg>