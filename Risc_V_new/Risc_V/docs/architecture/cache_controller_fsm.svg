<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627D98"/></marker></defs><rect width="1280" height="720" fill="#F7FAFC"/><text x="54" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="750" text-anchor="start" fill="#173F5F">FSM Cache/Memory Management Unit (cache controller)</text>
