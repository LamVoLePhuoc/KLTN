    <text x="490" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#627D98">• Chỉ một PTW request tại một thời điểm</text>
    <text x="490" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#627D98">• Không refill khi lỗi hoặc context đã thay đổi</text>
    <text x="490" y="615" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#627D98">• Fault chỉ pulse tại GATE; core resume đồng bộ</text>
    <text x="490" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#627D98">• Data-side được ưu tiên khi I/D cùng miss</text></svg>